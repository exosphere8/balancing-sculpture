name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  physics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (physics only, no Manim)
        run: pip install numpy scipy pytest
      - name: Run tests
        run: pytest -q
      - name: Export simulation data (smoke test)
        run: python render.py --data-only
