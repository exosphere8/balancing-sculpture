[project]
name = "balancing-sculpture"
version = "1.0.0"
description = "Physics of the 'impossible' balancing sculpture: model, Manim animation and interactive web app"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
render = ["manim>=0.18"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
